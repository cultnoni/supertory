<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SuperTory · 캐릭터 페이지 시안 5종</title>
<link rel="stylesheet" href="../fonts/pretendard.css">
<style>
:root{
  --bg:#f1efee; --panel:#fafafa; --sunk:#f1efec; --desk:#f4f2ef;
  --ink:#2b2a27; --ink2:#5d5e5b; --ink3:#8e8b84; --line:#e6e3de; --accent:#45463f; --accent-ink:#fafafa;
  --shadow:0 1px 2px rgba(43,42,39,.05),0 8px 24px rgba(43,42,39,.05);
  --fill:24%; --soft:9%; --edge:30%;
  --sans:"Pretendard","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  --serif:"Noto Serif KR","KoPub Batang","바탕",Batang,serif;
}
:root[data-theme="dark"]{
  --bg:#171615; --panel:#1f1e1c; --sunk:#282725; --desk:#1b1a19;
  --ink:#ece9e4; --ink2:#b3afa7; --ink3:#857f76; --line:#34322f; --accent:#d8d4c8; --accent-ink:#1f1e1c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);
  --fill:20%; --soft:10%; --edge:34%;
}
*{box-sizing:border-box;margin:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:13.5px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}

.bar{position:sticky;top:0;z-index:30;display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:9px 20px;background:#1f2429;color:#e8eaed;font-size:12.5px}
.bar b{font-weight:650;margin-right:8px}
.bar a{color:#9fb4c8;text-decoration:none;padding:4px 9px;border-radius:6px}.bar a:hover{background:#2c3238}
.bar .sp{flex:1}.bar button{padding:5px 11px;border-radius:7px;background:#2c3238;color:#cfd5db}
main{max-width:1240px;margin:0 auto;padding:26px 24px 80px}
h1{font-size:22px;font-weight:700;margin-bottom:6px}
.lead{color:var(--ink2);line-height:1.6;max-width:72ch;margin-bottom:30px}
section.v{margin-bottom:54px}
section.v>header{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
section.v>header h2{font-size:16px;font-weight:700}
section.v>header em{font-style:normal;font-size:11.5px;color:var(--ink3);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
section.v>p{color:var(--ink2);margin-bottom:14px;line-height:1.55;max-width:80ch}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(520px,1fr));gap:18px;align-items:start}
.cap{font-size:11.5px;color:var(--ink3);margin:0 0 6px 4px;font-weight:600}
.frame{background:var(--desk);border-radius:14px;padding:0;height:660px;overflow:auto}
.pg{padding:20px 26px 28px;min-height:100%}

/* ── 공통 부품 ── */
.tn-rose{--c:#e48b96}.tn-lilac{--c:#9d8bd2}.tn-mint{--c:#62b088}.tn-sky{--c:#6fa3d6}.tn-butter{--c:#e3bf55}.tn-gray{--c:#a8a49c}
.cdeep{color:color-mix(in srgb,var(--c) 68%,#000 32%)}
html[data-theme="dark"] .cdeep{color:color-mix(in srgb,var(--c) 70%,#fff 30%)}
.av{display:grid;place-items:center;flex:none;border-radius:50%;font-weight:650;background:color-mix(in srgb,var(--c) var(--fill),var(--panel));color:color-mix(in srgb,var(--c) 62%,#000 38%)}
html[data-theme="dark"] .av{color:color-mix(in srgb,var(--c) 70%,#fff 30%)}
.ic{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tb{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.tb h3{font-size:22px;font-weight:700;flex:1}
.ibtn{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--ink2)}
.ibtn:hover{background:var(--sunk)}
.gbtn{padding:6px 11px;border-radius:9px;color:var(--ink2);font-size:12.5px}.gbtn:hover{background:var(--sunk)}
.gbtn.danger{color:#b4584f}
.pbtn{padding:6px 13px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:12.5px;font-weight:600}
.view{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.flt{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.flt button{padding:5px 10px;border-radius:99px;color:var(--ink2);font-size:12.5px;white-space:nowrap}
.flt button i{font-style:normal;color:var(--ink3);margin-left:4px;font-size:11.5px}
.flt button.on{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chk{display:flex;align-items:center;gap:6px;color:var(--ink2);font-size:12.5px}
.chk:before{content:"";width:28px;height:16px;border-radius:99px;background:var(--line)}
.sum{color:var(--ink2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sum.empty{color:var(--ink3)}
.rl{font-size:12px;color:var(--ink3)}
.rl:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c);margin-right:6px;vertical-align:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:4px 10px;border-radius:99px;font-size:12.5px;color:var(--ink2);background:var(--sunk);border:1px solid transparent}
.chip.on{background:color-mix(in srgb,var(--c) var(--fill),var(--panel));color:color-mix(in srgb,var(--c) 60%,#000 40%);font-weight:600}
html[data-theme="dark"] .chip.on{color:color-mix(in srgb,var(--c) 70%,#fff 30%)}
.chip.add{color:var(--ink3);background:none;border:1px dashed var(--line)}
.lbl{font-size:12px;color:var(--ink3);font-weight:600;margin-bottom:6px;display:block}
.fld{width:100%;border:0;border-radius:9px;background:var(--sunk);padding:9px 12px;line-height:1.65;resize:none;outline:0;color:var(--ink)}
.fld:focus{box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 22%,transparent)}
textarea.fld{min-height:84px;overflow:hidden}
.nm{width:100%;border:0;background:none;outline:0;font-weight:700;font-size:26px;padding:2px 0;color:var(--ink)}
.cardlist{cursor:pointer}

/* ── A · 줄 목록 + 속성 표 ── */
.vA .rows{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.vA .row{display:grid;grid-template-columns:36px 1fr 1.4fr 16px;gap:14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer}
.vA .row:first-child{border-top:0}
.vA .row:hover{background:var(--sunk)}
.vA .row.on{background:color-mix(in srgb,var(--c) var(--soft),var(--panel))}
.vA .row .av{width:36px;height:36px;font-size:14px}
.vA .row b{display:block;font-size:14.5px}
.vA .row .sum{-webkit-line-clamp:1}
.vA .row .go{color:var(--ink3)}
.vA .doc{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:26px 30px}
.vA .head{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.vA .head .av{width:48px;height:48px;font-size:19px}
.vA .props{border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:22px}
.vA .prop{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center;padding:9px 0;border-top:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.vA .prop:first-child{border-top:0}
.vA .prop>span{color:var(--ink3);font-size:12.5px}
.vA .blk{margin-bottom:20px}
.vA .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* ── B · 초상 카드 + 좌측 초상 상세 ── */
.vB .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.vB .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:box-shadow .15s,border-color .15s}
.vB .card:hover,.vB .card.on{box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--c) 50%,var(--line))}
.vB .ph{height:96px;display:grid;place-items:center;font-size:34px;font-weight:650;background:color-mix(in srgb,var(--c) var(--fill),var(--panel));color:color-mix(in srgb,var(--c) 58%,#000 42%)}
html[data-theme="dark"] .vB .ph{color:color-mix(in srgb,var(--c) 70%,#fff 30%)}
.vB .card .tx{padding:11px 14px 14px;display:flex;flex-direction:column;gap:3px}
.vB .card b{font-size:15px}
.vB .doc{display:grid;grid-template-columns:190px 1fr;gap:26px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:24px}
.vB .side{display:flex;flex-direction:column;gap:12px}
.vB .big{aspect-ratio:1;border-radius:14px;display:grid;place-items:center;font-size:64px;font-weight:650;background:color-mix(in srgb,var(--c) var(--fill),var(--panel));color:color-mix(in srgb,var(--c) 58%,#000 42%)}
html[data-theme="dark"] .vB .big{color:color-mix(in srgb,var(--c) 70%,#fff 30%)}
.vB .side .gbtn{background:var(--sunk);text-align:center}
.vB .main{display:flex;flex-direction:column;gap:16px;min-width:0}
.vB .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ── C · 역할 색 띠 카드(그룹) + 섹션 카드 ── */
.vC .grp{margin-bottom:18px}
.vC .grp h4{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);margin-bottom:8px;font-weight:600}
.vC .grp h4:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.vC .grp h4 i{font-style:normal;color:var(--ink3);font-weight:400}
.vC .cg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vC .card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 15px 14px;overflow:hidden;cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px}
.vC .card:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--c);opacity:.85}
.vC .card.on{border-color:color-mix(in srgb,var(--c) 55%,var(--line))}
.vC .card b{font-size:15px}
.vC .top{background:color-mix(in srgb,var(--c) var(--soft),var(--panel));border:1px solid color-mix(in srgb,var(--c) var(--edge),var(--line));border-radius:14px;padding:20px 22px;display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.vC .top .r1{display:flex;align-items:center;gap:14px}
.vC .top .av{width:56px;height:56px;font-size:22px}
.vC .sc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 16px;margin-bottom:12px}
.vC .sc .lbl{display:flex;align-items:center;gap:7px}
.vC .sc .lbl:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.vC .sc .fld{background:none;padding:2px 0;min-height:60px}
.vC .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ── D · 가로 명함 + 2단 상세 ── */
.vD .cg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vD .card{display:grid;grid-template-columns:52px 1fr;gap:13px;align-items:center;padding:13px 14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.vD .card:hover,.vD .card.on{border-color:color-mix(in srgb,var(--c) 55%,var(--line));box-shadow:var(--shadow)}
.vD .card .av{width:52px;height:52px;font-size:20px}
.vD .card b{font-size:14.5px;margin-right:8px}
.vD .card .sum{-webkit-line-clamp:2;font-size:12.5px;margin-top:3px}
.vD .flt{background:var(--sunk);border-radius:10px;padding:3px;flex:none}
.vD .flt button{border-radius:8px}
.vD .hd{display:grid;grid-template-columns:76px 1fr;gap:18px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:12px;box-shadow:var(--shadow)}
.vD .hd .av{width:76px;height:76px;font-size:30px}
.vD .hd .nm{font-size:22px}
.vD .hd .fld{background:none;padding:2px 0;color:var(--ink2)}
.vD .cols{display:grid;grid-template-columns:1.25fr 1fr;gap:12px}
.vD .col{display:flex;flex-direction:column;gap:12px}
.vD .bx{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.vD .bx .fld{background:none;padding:2px 0;min-height:60px}
.vD .bx.tall .fld{min-height:230px}

/* ── E · 타이포 중심 ── */
.vE .pg{padding:26px 34px 34px}
.vE .tb h3{font-family:var(--serif);font-size:26px;font-weight:600}
.vE .flt button{border-radius:0;padding:4px 2px;margin-right:12px;background:none!important;box-shadow:none!important;border-bottom:1.5px solid transparent}
.vE .flt button.on{border-bottom-color:var(--ink)}
.vE .ix{display:grid;grid-template-columns:1fr 1fr;column-gap:34px}
.vE .it{display:grid;grid-template-columns:28px 1fr;gap:6px;padding:16px 0 18px;border-top:1px solid var(--line);cursor:pointer}
.vE .it:hover .nmx{text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--line)}
.vE .it.on .nmx{text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--c);text-decoration-thickness:2px}
.vE .it .n{font-size:11.5px;color:var(--ink3);padding-top:6px;font-variant-numeric:tabular-nums}
.vE .nmx{font-family:var(--serif);font-size:19px;font-weight:600}
.vE .it .rl{display:block;margin:3px 0 7px}
.vE .it .sum{font-size:13px}
.vE .dd{max-width:560px;margin:0 auto;padding-top:8px}
.vE .dd .rlx{font-size:11.5px;letter-spacing:.08em;color:var(--ink3);margin-bottom:8px}
.vE .dd .nm{font-family:var(--serif);font-size:38px;font-weight:600;padding:0;margin-bottom:6px}
.vE .dd .q{font-family:var(--serif);font-size:16px;color:var(--ink2);border:0;background:none;width:100%;outline:0;padding:0;margin-bottom:22px;font-style:italic}
.vE .dd hr{border:0;border-top:1px solid var(--line);margin:0 0 20px}
.vE .dd .lbl{text-transform:uppercase;letter-spacing:.06em;font-size:10.5px}
.vE .dd .fld{background:none;padding:0;font-family:var(--serif);line-height:1.85;font-size:14.5px;min-height:70px}
.vE .dd .sec{margin-bottom:22px}
.vE .dd .two{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.vE .dd .chips .chip{background:none;border:1px solid var(--line)}

@media (max-width:640px){.pair{grid-template-columns:1fr}.vB .doc{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="bar">
  <b>캐릭터 페이지 시안</b>
  <a href="#A">A 줄 목록</a><a href="#B">B 초상 카드</a><a href="#C">C 역할 색 띠</a><a href="#D">D 가로 명함</a><a href="#E">E 타이포</a>
  <span class="sp"></span>
  <button id="theme">라이트 / 다크</button>
</div>
<main>
  <h1>캐릭터 페이지 — 5가지 시안</h1>
  <p class="lead">각 시안마다 <b>인물 목록</b>(메인 보드)과 <b>인물 상세</b>(편집 화면)를 같은 문법으로 맞췄습니다. 기능은 그대로입니다 — 역할 필터·그룹으로 보기·관계 이어보기·토리·새 캐릭터, 그리고 상세의 이미지·정렬용 이름·역할·한 줄 소개·인물 설정·강점/약점·작가 메모·별칭·연대기. 목록의 인물을 눌러 상세가 바뀌는 것도 확인해 보세요. 색은 메모와 같은 파스텔 토큰만 씁니다.</p>
  <div id="out"></div>
</main>
<script>
const CH=[
 {n:"한서윤",r:"주연",c:"rose",s:"밤에만 일하는 서점 주인",p:"서른하나. 낮에는 잠들어 있고 밤에만 불을 켠다. 말수가 적지만 손님의 책 취향은 한 번에 맞힌다. 편지를 태우지 못하는 버릇이 있다.",st:"관찰력, 기억력, 손님을 편하게 하는 침묵",w:"불리할 때 먼저 선을 긋는다. 도움을 청하지 못함.",m:"11화에서 시계탑 복선 회수. 말버릇은 4화 이전에 한 번 깨지게.",a:["서점지기","서윤 씨"],sort:"한, 서윤"},
 {n:"도하준",r:"적대자",c:"lilac",s:"서윤의 과거를 아는 출판사 편집자",p:"서윤이 쓴 첫 원고를 쥐고 있는 사람. 친절한 얼굴로 거래를 제안한다. 악의보다 집착에 가깝다.",st:"설득, 인맥, 정확한 기억",w:"서윤의 거절 앞에서 말이 거칠어진다.",m:"7화 이후 서점 방문 횟수를 늘릴 것.",a:["편집자님"],sort:"도, 하준"},
 {n:"이솔",r:"조력자",c:"mint",s:"옆 가게 꽃집 사장",p:"섬에서 나고 자란 서윤의 유일한 친구. 새벽마다 꽃을 들고 서점 문을 두드린다.",st:"눈치, 요리, 소문의 출처를 아는 것",w:"비밀을 오래 못 품는다.",m:"사투리는 어미만 살짝.",a:["솔이"],sort:"이, 솔"},
 {n:"마을 이장",r:"단역",c:"sky",s:"섬 마을 이장",p:"행사 때마다 마이크를 잡는다. 서윤을 아직도 ‘서점 집 딸’이라 부른다.",st:"",w:"",m:"",a:[],sort:"이장"},
 {n:"윤",r:"",c:"gray",s:"",p:"",st:"",w:"",m:"",a:[],sort:"윤"}
];
const RL=["전체","주연","적대자","조력자","단역","미지정"];
const CNT=[5,1,1,1,1,1];
const NA=["한 서","도 하","이 솔","마 을","윤"];
const IC={
 rel:'<svg class="ic" viewBox="0 0 24 24"><path d="m11 19-1.106-.552a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0l4.212 2.106a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619V12"/><path d="M15 5.764V12"/><path d="M18 15v6"/><path d="M21 18h-6"/><path d="M9 3.236v15"/></svg>',
 tori:'<svg class="ic" viewBox="0 0 24 24"><path d="m15 5 4 4"/><path d="M21.17 6.81a2.82 2.82 0 0 0-3.99-3.99L3.84 16.17a2 2 0 0 0-.5.83l-1.32 4.35a.5.5 0 0 0 .62.62l4.35-1.32a2 2 0 0 0 .83-.5z"/></svg>',
 add:'<svg class="ic" viewBox="0 0 24 24"><path d="M2 21a8 8 0 0 1 13.29-6"/><circle cx="10" cy="8" r="5"/><path d="M19 16v6"/><path d="M22 19h-6"/></svg>',
 x:'<svg class="ic" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>',
 go:'<svg class="ic" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>'
};
const tn=c=>`tn-${c}`;
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const sumH=(ch)=>ch.s?`<span class="sum">${esc(ch.s)}</span>`:`<span class="sum empty">소개를 적어 보세요</span>`;
const roleH=(ch)=>`<span class="rl">${ch.r||"역할 미지정"}</span>`;
const ini=(ch)=>ch.n[0];
const flt=()=>`<div class="flt">${RL.map((r,i)=>`<button class="${i?"":"on"}">${r}<i>${CNT[i]}</i></button>`).join("")}</div>`;
const boardTb=(title="캐릭터")=>`<div class="tb"><h3>${title}</h3><button class="ibtn" title="관계 이어보기">${IC.rel}</button><button class="ibtn" title="토리야 작성해줘">${IC.tori}</button><button class="ibtn" title="새 캐릭터">${IC.add}</button><button class="ibtn" title="닫기">${IC.x}</button></div>`;
const viewBar=()=>`<div class="view">${flt()}<span class="chk">그룹으로 보기</span></div>`;
const edTb=(label="캐릭터 설정")=>`<div class="tb"><h3 style="font-size:13px;color:var(--ink3);font-weight:600">${label}</h3><span class="sp" style="flex:1"></span><span style="font-size:12px;color:var(--ink3)">자동 저장됨</span><button class="gbtn">연대기</button><button class="gbtn danger">인물 삭제</button><button class="pbtn">저장</button><button class="ibtn" title="닫기">${IC.x}</button></div>`;
const roleChips=(ch)=>`<div class="chips">${["주연","적대자","조력자","단역"].map(r=>`<span class="chip ${r===ch.r?"on":""}">${r}</span>`).join("")}<span class="chip add">+ 추가</span></div>`;
const aliasChips=(ch)=>`<div class="chips">${ch.a.map(x=>`<span class="chip">${esc(x)}</span>`).join("")}<span class="chip add">+ 별칭 추가</span></div>`;
const ta=(v,ph,rows)=>`<textarea class="fld" placeholder="${ph}" ${rows?`style="min-height:${rows}px"`:""}>${esc(v)}</textarea>`;

const V={
A:{
 list(){return `<div class="pg">${boardTb()}${viewBar()}<div class="rows">${CH.map((ch,i)=>`<div class="row ${tn(ch.c)} ${i?"":"on"}" data-i="${i}"><span class="av">${ini(ch)}</span><div><b>${esc(ch.n)}</b>${roleH(ch)}</div>${sumH(ch)}<span class="go">${IC.go}</span></div>`).join("")}</div></div>`},
 detail(ch){return `<div class="pg ${tn(ch.c)}">${edTb()}<div class="doc"><div class="head"><span class="av">${ini(ch)}</span><input class="nm" value="${esc(ch.n)}" placeholder="캐릭터 이름"></div>
  <div class="props"><div class="prop"><span>역할</span>${roleChips(ch)}</div><div class="prop"><span>정렬용 이름</span><input class="fld" value="${esc(ch.sort)}" style="padding:5px 10px"></div><div class="prop"><span>별칭</span>${aliasChips(ch)}</div><div class="prop"><span>이미지</span><span><button class="gbtn" style="background:var(--sunk)">이미지 추가</button></span></div></div>
  <div class="blk"><span class="lbl">한 줄 소개</span><input class="fld" value="${esc(ch.s)}" placeholder="예: 밤에만 일하는 서점 주인"></div>
  <div class="blk"><span class="lbl">인물 설정</span>${ta(ch.p,"외모, 성격, 과거, 목표 등 자유롭게 적으세요.",120)}</div>
  <div class="blk two"><div><span class="lbl">무기 · 강점</span>${ta(ch.st,"예: 빠른 판단력")}</div><div><span class="lbl">약점</span>${ta(ch.w,"예: 고집에 셈")}</div></div>
  <div class="blk"><span class="lbl">작가 메모</span>${ta(ch.m,"독자에게 보이지 않는 비밀 설정이나 수정 메모")}</div></div></div>`}
},
B:{
 list(){return `<div class="pg">${boardTb()}${viewBar()}<div class="grid">${CH.map((ch,i)=>`<div class="card ${tn(ch.c)} ${i?"":"on"}" data-i="${i}"><div class="ph">${ini(ch)}</div><div class="tx"><b>${esc(ch.n)}</b>${roleH(ch)}${sumH(ch)}</div></div>`).join("")}</div></div>`},
 detail(ch){return `<div class="pg ${tn(ch.c)}">${edTb()}<div class="doc"><div class="side"><div class="big">${ini(ch)}</div><button class="gbtn">이미지 추가</button><div><span class="lbl">역할</span>${roleChips(ch)}</div></div>
  <div class="main"><input class="nm" value="${esc(ch.n)}" placeholder="캐릭터 이름"><div><span class="lbl">한 줄 소개</span><input class="fld" value="${esc(ch.s)}" placeholder="예: 밤에만 일하는 서점 주인"></div>
  <div><span class="lbl">인물 설정</span>${ta(ch.p,"외모, 성격, 과거, 목표 등 자유롭게 적으세요.",130)}</div>
  <div class="two"><div><span class="lbl">무기 · 강점</span>${ta(ch.st,"예: 빠른 판단력")}</div><div><span class="lbl">약점</span>${ta(ch.w,"예: 고집에 셈")}</div></div>
  <div><span class="lbl">작가 메모</span>${ta(ch.m,"독자에게 보이지 않는 비밀 설정이나 수정 메모")}</div>
  <div><span class="lbl">다른 이름 / 별칭 · 정렬용 이름 ${esc(ch.sort)}</span>${aliasChips(ch)}</div></div></div></div>`}
},
C:{
 list(){const g=[["주연","rose",0],["적대자","lilac",1],["조력자","mint",2],["단역","sky",3],["역할 미지정","gray",4]];
  return `<div class="pg">${boardTb()}${viewBar()}${g.map(([t,c,i])=>{const ch=CH[i];return `<div class="grp ${tn(c)}"><h4>${t} <i>1</i></h4><div class="cg"><div class="card ${tn(ch.c)} ${i?"":"on"}" data-i="${i}"><b>${esc(ch.n)}</b>${roleH(ch)}${sumH(ch)}</div></div></div>`}).join("")}</div>`},
 detail(ch){return `<div class="pg ${tn(ch.c)}">${edTb()}<div class="top"><div class="r1"><span class="av">${ini(ch)}</span><div style="flex:1"><input class="nm" value="${esc(ch.n)}" placeholder="캐릭터 이름" style="font-size:24px"></div><button class="gbtn" style="background:var(--panel)">이미지 추가</button></div>${roleChips(ch)}<input class="fld" value="${esc(ch.s)}" placeholder="한 줄 소개" style="background:color-mix(in srgb,var(--panel) 70%,transparent)"></div>
  <div class="sc"><span class="lbl">인물 설정</span>${ta(ch.p,"외모, 성격, 과거, 목표 등 자유롭게 적으세요.",110)}</div>
  <div class="two"><div class="sc"><span class="lbl">무기 · 강점</span>${ta(ch.st,"예: 빠른 판단력")}</div><div class="sc"><span class="lbl">약점</span>${ta(ch.w,"예: 고집에 셈")}</div></div>
  <div class="sc"><span class="lbl">작가 메모</span>${ta(ch.m,"독자에게 보이지 않는 비밀 설정이나 수정 메모")}</div>
  <div class="sc"><span class="lbl">다른 이름 / 별칭</span>${aliasChips(ch)}</div></div>`}
},
D:{
 list(){return `<div class="pg">${boardTb()}${viewBar()}<div class="cg">${CH.map((ch,i)=>`<div class="card ${tn(ch.c)} ${i?"":"on"}" data-i="${i}"><span class="av">${ini(ch)}</span><div><b>${esc(ch.n)}</b>${roleH(ch)}${sumH(ch)}</div></div>`).join("")}</div></div>`},
 detail(ch){return `<div class="pg ${tn(ch.c)}">${edTb()}<div class="hd"><span class="av">${ini(ch)}</span><div style="display:flex;flex-direction:column;gap:6px"><input class="nm" value="${esc(ch.n)}" placeholder="캐릭터 이름"><input class="fld" value="${esc(ch.s)}" placeholder="한 줄 소개"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${roleChips(ch)}</div></div></div>
  <div class="cols"><div class="col"><div class="bx tall"><span class="lbl">인물 설정</span>${ta(ch.p,"외모, 성격, 과거, 목표 등 자유롭게 적으세요.")}</div><div class="bx"><span class="lbl">다른 이름 / 별칭</span>${aliasChips(ch)}</div></div>
  <div class="col"><div class="bx"><span class="lbl">무기 · 강점</span>${ta(ch.st,"예: 빠른 판단력")}</div><div class="bx"><span class="lbl">약점</span>${ta(ch.w,"예: 고집에 셈")}</div><div class="bx"><span class="lbl">작가 메모</span>${ta(ch.m,"독자에게 보이지 않는 비밀 설정")}</div></div></div></div>`}
},
E:{
 list(){return `<div class="pg">${boardTb()}${viewBar()}<div class="ix">${CH.map((ch,i)=>`<div class="it ${tn(ch.c)} ${i?"":"on"}" data-i="${i}"><span class="n">0${i+1}</span><div><span class="nmx">${esc(ch.n)}</span>${roleH(ch)}${sumH(ch)}</div></div>`).join("")}</div></div>`},
 detail(ch){const RK={"주연":"PROTAGONIST","적대자":"ANTAGONIST","조력자":"SUPPORTING","단역":"MINOR","":"—"};return `<div class="pg ${tn(ch.c)}">${edTb()}<div class="dd"><div class="rlx"><span class="rl">${RK[ch.r]} · ${ch.r||"역할 미지정"}</span></div><input class="nm" value="${esc(ch.n)}" placeholder="캐릭터 이름"><input class="q" value="${esc(ch.s)}" placeholder="한 줄 소개를 적어 보세요"><hr>
  <div class="sec"><span class="lbl">인물 설정</span>${ta(ch.p,"외모, 성격, 과거, 목표 등 자유롭게 적으세요.",120)}</div>
  <div class="sec two"><div><span class="lbl">무기 · 강점</span>${ta(ch.st,"—")}</div><div><span class="lbl">약점</span>${ta(ch.w,"—")}</div></div>
  <div class="sec"><span class="lbl">작가 메모</span>${ta(ch.m,"독자에게 보이지 않는 비밀 설정")}</div>
  <div class="sec"><span class="lbl">별칭</span>${aliasChips(ch)}</div></div></div>`}
}
};
const META={
 A:["줄 목록 · 속성 표","가장 차분 · 정보 밀도 높음","한 줄에 한 명, 선만으로 구분. 인물이 많아져도 훑어보기 좋습니다. 상세는 노션식 ‘속성 표’(역할·정렬용 이름·별칭·이미지)를 위에 모아 본문 입력이 아래에서 길게 이어집니다."],
 B:["초상 카드 · 좌측 초상 상세","가장 시각적","초상 영역이 큰 카드 그리드. 이미지를 올리면 그 자리에 그대로 들어가고, 없으면 파스텔 이니셜입니다. 상세는 왼쪽에 초상·역할, 오른쪽에 입력 필드를 둡니다."],
 C:["역할 색 띠 · 섹션 카드","가장 정돈된 분류","그룹으로 보기를 기본 시안으로 삼고, 역할 색을 카드 위 띠로만 씁니다(생각수첩 ‘색 띠’와 같은 문법). 상세는 머리 카드에 이름·역할·한 줄 소개를 모으고 입력은 섹션 카드로 나눕니다."],
 D:["가로 명함 · 2단 상세","가장 컴팩트","원형 초상+이름·역할·소개가 가로로 놓이는 명함형. 상세는 머리 영역에 핵심(이름·한 줄 소개·역할)을, 아래는 왼쪽 인물 설정·오른쪽 강점/약점/메모로 한 화면에 들어옵니다."],
 E:["타이포 중심 · 에디토리얼","가장 미니멀","카드·면 없이 구분선과 글자 크기로만 짜는 안. 인물 목록은 목차 같고, 상세는 책 속표지처럼 이름과 한 줄 소개가 먼저 보이는 읽기 좋은 집필 문서입니다."]
};
const out=document.getElementById("out");
out.innerHTML=Object.keys(V).map(id=>`<section class="v v${id}" id="${id}"><header><h2>${id}. ${META[id][0]}</h2><em>${META[id][1]}</em></header><p>${META[id][2]}</p>
 <div class="pair"><div><div class="cap">인물 목록 (메인 보드)</div><div class="frame" data-role="list"></div></div><div><div class="cap">인물 상세 (편집 화면)</div><div class="frame" data-role="detail"></div></div></div></section>`).join("");
function grow(root){root.querySelectorAll('textarea.fld').forEach(t=>{t.style.height='auto';t.style.height=Math.max(t.scrollHeight,parseInt(t.style.minHeight)||0)+'px'})}
function paint(id,i){const s=document.getElementById(id);s.querySelector('[data-role=detail]').innerHTML=V[id].detail(CH[i]);grow(s);
  s.querySelectorAll('[data-i]').forEach(e=>e.classList.toggle("on",+e.dataset.i===i))}
Object.keys(V).forEach(id=>{const s=document.getElementById(id);s.querySelector('[data-role=list]').innerHTML=V[id].list();paint(id,0);
  s.querySelector('[data-role=list]').addEventListener("click",e=>{const t=e.target.closest("[data-i]");if(t)paint(id,+t.dataset.i)})});
document.getElementById("theme").onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==="dark"?"":"dark"};
</script>
</body>
</html>
